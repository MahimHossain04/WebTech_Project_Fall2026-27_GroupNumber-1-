<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../design/Student.css">
    <title>Student Login - PabeKothay</title>
</head>
<body>
    <header class="header">
        <img src="../image/pabekothay logo 1.jpeg" alt="PabeKothay Logo" id="logo">
        <h1>PabeKothay</h1>
    </header>
    <main class="login-container">
        <div class="page-header">
            <h1>Student Login</h1>
            <p>Sign in to the Student portal to access marketplace and selling tools.</p>
        </div>
    <form>
        <table>
            <tr>
                <td><label for="suname">Username:</label></td>
                <td><input type="text" id="suname" name="suname" required></td>
            </tr>
            <tr>
                <td><label for="spass">Password:</label></td>
                <td><input type="password" id="spass" name="spass" required></td>
            </tr>
        </table>
        <br>
        <div class="form-actions">
                    <button type="submit" class="btn-primary" href="Marketplace.html">Log In</button>
                    <span class="action-links">
                        <a href="#">Forgot password?</a> 
                        <a href="../page/StudentRegister.html">Create account</a>
                    </span>
        </div>
    </form>
    </main>
    <footer>
        <p>&copy; 2026 PabeKothay. All rights reserved.</p>
    </footer>
</body>
</html>
